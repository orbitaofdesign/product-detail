<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INAB Shop</title>
<meta name="description" content="표정과 움직임, 헤어의 결까지 설계합니다. 버추얼 캐릭터의 인상과 감정을 세심하게 완성합니다.">
<link rel="preload" href="fonts/Cafe24ClassicType-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Cafe24 ClassicType";src:url(fonts/Cafe24ClassicType-latin.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-4Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-5Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-7Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Paperlogy";src:url(fonts/Paperlogy-8ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}

/* PSD(1920×1080) 수치를 그대로 쓰기 위한 단위: 1u = 화면에서 PSD 1px */
:root{
  --text:#ece6f3;      /* INAB, 버튼·문구 글자, 아이콘 버튼 */
  --purple:#6d48b3;    /* Shop, 포트폴리오 버튼, 문구 그라데이션 */
  --deep:#65469f;      /* 방사형 그라데이션, 아이콘 색 */
  --script:#784fbb;    /* Inabi 필기체 */
  --night:#15101c;     /* 배경 아래로 이어지는 바탕색 */
  --f-serif:"Cafe24 ClassicType",Georgia,serif;
  --f-sans:"Paperlogy","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --vh:100vh;
  --u:min(calc(100vw / 1920), calc(var(--vh) / 1080));
}
@supports (height:100svh){:root{--vh:100svh}}
@media (max-aspect-ratio:4/5){:root{--u:calc(100vw / 1080)}}

*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;background:var(--night);color:var(--text);font-family:var(--f-sans)}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}

/* ---------- 인트로 ---------- */
.intro{position:relative;height:var(--vh);min-height:520px;overflow:hidden;background:var(--night);isolation:isolate}

/* 배경 + 레이어 마스크(아래쪽을 바탕색으로 부드럽게) */
.bg{position:absolute;inset:0;background:url(bg-2560.webp) 32% 32% / cover no-repeat;transform-origin:30% 40%;
  -webkit-mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.45) 78%,rgba(0,0,0,.08) 96%,transparent 100%);
          mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.45) 78%,rgba(0,0,0,.08) 96%,transparent 100%)}
@media (max-width:900px){.bg{background-image:url(bg-1280.webp)}}
@media (min-width:2200px){.bg{background-image:url(bg-3840.webp)}}
/* 왼쪽 아래 모서리 중심 방사형 그라데이션 #65469f → 투명 */
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 100% at 0% 100%,rgba(101,70,159,.9) 0%,rgba(101,70,159,.62) 32%,rgba(101,70,159,.22) 62%,rgba(101,70,159,0) 100%)}
.sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:linear-gradient(115deg,transparent 40%,rgba(236,230,243,.28) 48%,transparent 56%);background-size:250% 100%;background-position:120% 0}

/* 오른쪽 위 나비 로고 */
.logo-btn{position:absolute;z-index:3;top:calc(30 * var(--u) + env(safe-area-inset-top,0px));right:calc(30 * var(--u) + env(safe-area-inset-right,0px));
  width:max(44px,calc(70 * var(--u)));aspect-ratio:1;border-radius:50%;display:block;transition:filter .3s}
.logo-btn img{width:100%;height:100%;display:block}
.logo-btn:hover{filter:drop-shadow(0 0 12px rgba(236,230,243,.6))}

/* 왼쪽 아래 카피 */
.hero{position:absolute;z-index:2;left:max(calc(106 * var(--u)),20px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(max(calc(50 * var(--u)),24px) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start}

.wordmark{position:relative;margin:0 0 0 calc(-4 * var(--u));font-weight:400;font-family:var(--f-serif);font-size:calc(150 * var(--u));line-height:.82;
  display:flex;flex-wrap:wrap;align-items:baseline;column-gap:calc(42 * var(--u))}
.wordmark .w{display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent;filter:url(#innerHi);
  /* 글자가 줄 높이보다 위로 솟는 부분까지 색이 칠해지도록 여유를 주고, 위치는 그대로 유지 */
  padding:.22em .06em .14em;margin:-.22em -.06em -.14em}
/* INAB: #ece6f3 + 그레이디언트 오버레이(표준 10%, #65469f→투명, 135°) + 내부 그림자 */
.wordmark .inab{background-image:linear-gradient(135deg,rgba(101,70,159,.10),rgba(101,70,159,0)),linear-gradient(var(--text),var(--text))}
/* Shop: #6d48b3 + 그레이디언트 오버레이(오버레이 10%, 흰색, -45° 반전) + 내부 그림자 */
.wordmark .shop{background-image:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0)),linear-gradient(var(--purple),var(--purple));background-blend-mode:overlay,normal;letter-spacing:-.03em}
/* Inabi(Amanda #784fbb): PSD에서 내보낸 PNG를 원래 위치에 */
.wordmark .script{position:absolute;z-index:1;left:calc(-32 * var(--u));top:calc(-11.5 * var(--u));width:calc(447 * var(--u));height:auto;max-width:none;pointer-events:none}

.links{display:flex;align-items:center;gap:calc(30 * var(--u));flex-wrap:wrap;margin-top:calc(24 * var(--u))}
.links .cta{margin-right:calc(6 * var(--u))}
/* 포트폴리오 보기: #6d48b3 + 내부 그림자(흰색 25%, 1px, 135°) + 그레이디언트 오버레이(오버레이 10%) */
.cta{display:inline-flex;align-items:center;gap:calc(14 * var(--u));text-decoration:none;color:var(--text);font-weight:700;
  font-size:max(13px,calc(19 * var(--u)));height:max(38px,calc(50 * var(--u)));width:max(152px,calc(200 * var(--u)));justify-content:center;padding:0;border-radius:999px;
  background-color:var(--purple);background-image:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0));background-blend-mode:overlay;
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.25);transition:filter .2s,transform .2s}
.cta:hover{filter:brightness(1.12);transform:translateY(-1px)}
.cta svg{width:.5em;height:.9em}
/* 아이콘 버튼: #ece6f3 원 + 내부 그림자 + 그레이디언트 오버레이(표준 10%, #65469f, -45° 반전), 아이콘 #65469f */
.icon{position:relative;width:max(36px,calc(50 * var(--u)));aspect-ratio:1;border-radius:50%;display:block;
  background-color:var(--text);background-image:linear-gradient(135deg,rgba(101,70,159,0),rgba(101,70,159,.10));
  box-shadow:inset 1px 1px 0 rgba(255,255,255,.25);transition:transform .2s,filter .2s}
.icon:hover{transform:translateY(-1px);filter:drop-shadow(0 0 10px rgba(236,230,243,.5))}
/* 원본 기준: 원 50px 안에 아이콘 높이 20px, 가운데 정렬 */
.icon i{position:absolute;left:50%;top:50%;height:40%;transform:translate(-50%,-50%);background:var(--deep);-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat}
.icon.art i{width:46.6%;--m:url(ic-artmug.png)}
.icon.x i{width:44.4%;--m:url(ic-x.png)}
.icon.dc i{width:52.6%;--m:url(ic-discord.png)}

/* 문구 2줄: 페이퍼로지 #ece6f3 + 그레이디언트 오버레이(표준 25%, #6d48b3, 아래쪽) */
.copy{margin:calc(34 * var(--u)) 0 0;display:flex;flex-direction:column;gap:calc(5 * var(--u))}
.copy span{display:inline-block;width:fit-content;-webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(to bottom,rgba(109,72,179,0),rgba(109,72,179,.25)),linear-gradient(var(--text),var(--text))}
.copy .l1{font-weight:700;font-size:max(17px,calc(30 * var(--u)));letter-spacing:-.01em}
.copy .l2{font-weight:500;font-size:max(12px,calc(20 * var(--u)))}

.scroll-cue{position:absolute;z-index:2;right:calc(max(calc(40 * var(--u)),18px) + env(safe-area-inset-right,0px));bottom:calc(max(calc(48 * var(--u)),24px) + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.3em;color:var(--text);text-decoration:none;writing-mode:vertical-rl;opacity:.8}
.scroll-cue i{width:1px;height:40px;background:linear-gradient(var(--text),transparent);animation:drip 2.2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- 로더 ---------- */
.veil{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,#24173a,var(--night));clip-path:circle(150% at 50% 50%)}
.mark{display:flex;flex-direction:column;align-items:center;gap:18px}
.mark .logo{width:96px;height:96px;position:relative;animation:floaty 2.4s ease-in-out infinite}
.mark .logo img{width:100%;height:100%;display:block}
.mark .logo::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(120,79,187,.6);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.88);opacity:1}to{transform:scale(1.35);opacity:0}}
@keyframes floaty{50%{transform:translateY(-4px)}}
.mark .name{font-family:var(--f-serif);font-size:20px;letter-spacing:.42em;padding-left:.42em}
.mark .bar{width:120px;height:1px;background:rgba(236,230,243,.18);overflow:hidden}
.mark .bar b{display:block;height:100%;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform .4s ease}
.skip{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));font:inherit;font-size:12px;letter-spacing:.1em;
  color:rgba(236,230,243,.7);background:transparent;border:1px solid rgba(236,230,243,.3);border-radius:999px;padding:6px 14px;cursor:pointer}
.skip:hover{color:var(--text);border-color:var(--text)}

/* ---------- 등장 연출 (JS가 .anim을 붙였을 때만) ---------- */
.anim .bg{transform:scale(1.14);filter:blur(10px) brightness(.5)}
.anim .hero > *,.anim .logo-btn,.anim .scroll-cue{opacity:0}
.anim .wordmark .script{clip-path:inset(-20% 100% -20% 0)}
.anim.open .veil{clip-path:circle(0% at 50% 50%);transition:clip-path 1.2s cubic-bezier(.7,0,.2,1)}
.anim.open .veil .mark{opacity:0;transform:scale(.9);transition:opacity .4s,transform .6s}
.anim.open .bg{animation:reveal 2.6s cubic-bezier(.2,.7,.2,1) .15s forwards,breathe 22s ease-in-out 2.75s infinite alternate}
@keyframes reveal{to{transform:scale(1);filter:blur(0) brightness(1)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.035)}}
.anim.open .sweep{animation:sweep 1.8s ease-in-out 2.6s forwards}
@keyframes sweep{0%{opacity:0;background-position:120% 0}20%{opacity:1}100%{opacity:0;background-position:-30% 0}}
.anim.open .hero > *,.anim.open .logo-btn{animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
.anim.open .scroll-cue{animation:upDim 1s cubic-bezier(.2,.7,.2,1) 2.6s forwards}
.anim.open .wordmark{animation-delay:1.3s}
.anim.open .links{animation-delay:1.75s}
.anim.open .copy{animation-delay:1.95s}
.anim.open .logo-btn{animation-delay:2.1s}
.anim.open .wordmark .script{animation:write 1.4s cubic-bezier(.5,0,.3,1) 1.9s forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes upDim{from{opacity:0}to{opacity:.8}}
@keyframes write{to{clip-path:inset(-20% -10% -20% 0)}}

@media (max-aspect-ratio:4/5){
  .bg{background-position:30% 20%;-webkit-mask-image:linear-gradient(to bottom,#000 45%,transparent 92%);mask-image:linear-gradient(to bottom,#000 45%,transparent 92%)}
  .glow{background:radial-gradient(120% 70% at 0% 100%,var(--deep) 0%,rgba(101,70,159,.5) 45%,rgba(101,70,159,0) 100%)}
  .scroll-cue{display:none}
}
@media (prefers-reduced-motion:reduce){
  .veil{display:none}
  .anim .bg,.anim.open .bg{animation:none;transform:none;filter:none}
  .anim .hero > *,.anim .logo-btn{opacity:1!important;animation:none!important}
  .anim .scroll-cue{opacity:.8!important;animation:none!important}
  .anim .wordmark .script{clip-path:none;animation:none!important}
  .sweep{display:none}
  .scroll-cue i,.mark .logo,.mark .logo::after{animation:none}
}

/* ---------- 인트로 다음 영역 (자리만) ---------- */
.next{padding-block:96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--night)}
.next .in{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.next .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--script)}
.next h2{margin:0;font-family:var(--f-serif);font-weight:400;font-size:clamp(34px,5vw,56px)}
.next p{margin:0;max-width:680px;color:rgba(236,230,243,.7);line-height:1.8;font-size:17px}
</style>
</head>
<body>

<!-- 내부 그림자: 선형 닷지(추가), 흰색 25%, 각도 135°, 거리 1px, 크기 0 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="innerHi" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
    <feOffset in="SourceAlpha" dx="1" dy="1" result="shift"/>
    <feComposite in="SourceAlpha" in2="shift" operator="out" result="edge"/>
    <feFlood flood-color="#ffffff" flood-opacity=".25"/>
    <feComposite in2="edge" operator="in" result="hi"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="hi"/></feMerge>
  </filter>
</svg>

<main>
  <section class="intro" id="intro" aria-label="INAB Shop">
    <div class="bg" role="img" aria-label="보라색 헤드폰을 쓴 버추얼 캐릭터와 고양이 인형"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="sweep" aria-hidden="true"></div>

    <a class="logo-btn" href="#intro" aria-label="INAB 처음으로"><img src="logo.png" alt=""></a>

    <div class="hero">
      <h1 class="wordmark" aria-label="INAB Shop">
        <span class="w inab" aria-hidden="true">INAB</span>
        <span class="w shop" aria-hidden="true">Shop</span>
        <img class="script" src="inabi.png" alt="" aria-hidden="true">
      </h1>
      <div class="links">
        <a class="cta" href="#portfolio">포트폴리오 보기
          <svg viewBox="0 0 8 14" aria-hidden="true"><path d="M1.2 1.2l5.6 5.8-5.6 5.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="icon art" href="#" target="_blank" rel="noopener" data-todo aria-label="아트머그"><i></i></a>
        <a class="icon x" href="#" target="_blank" rel="noopener" data-todo aria-label="X"><i></i></a>
        <a class="icon dc" href="#" target="_blank" rel="noopener" data-todo aria-label="디스코드"><i></i></a>
      </div>
      <p class="copy">
        <span class="l1">표정과 움직임, 헤어의 결까지 설계합니다.</span>
        <span class="l2">버추얼 캐릭터의 인상과 감정을 세심하게 완성합니다.</span>
      </p>
    </div>

    <a class="scroll-cue" href="#portfolio">SCROLL<i aria-hidden="true"></i></a>

    <div class="veil" id="veil" aria-hidden="true" hidden>
      <div class="mark">
        <div class="logo"><img src="logo.png" alt=""></div>
        <div class="name">INAB</div>
        <div class="bar"><b id="bar"></b></div>
      </div>
      <button class="skip" id="skip" type="button">건너뛰기</button>
    </div>
  </section>

  <section class="next" id="portfolio" aria-labelledby="pf-h">
    <div class="in">
      <span class="eyebrow">PORTFOLIO</span>
      <h2 id="pf-h">Portfolio</h2>
      <p>인트로 다음에 이어질 포트폴리오 영역 자리입니다. 작업 이미지와 설명을 받으면 이곳에 구성합니다.</p>
    </div>
  </section>
</main>

<script>
(function(){
  var intro=document.getElementById('intro'), veil=document.getElementById('veil'), bar=document.getElementById('bar');
  document.querySelectorAll('[data-todo]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault()})});
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  intro.classList.add('anim'); veil.hidden=false;
  var opened=false;
  function open(){
    if(opened) return; opened=true;
    bar.style.transform='scaleX(1)';
    intro.classList.add('open');
    setTimeout(function(){veil.hidden=true},1400);
  }
  // 화면 크기에 맞는 배경 파일을 미리 불러온 뒤 공개
  var w=window.innerWidth, src=w>=2200?'bg-3840.webp':(w<=900?'bg-1280.webp':'bg-2560.webp');
  var img=new Image(), loaded=false, minTime=false;
  function tryOpen(){ if(loaded&&minTime) open() }
  img.onload=img.onerror=function(){loaded=true;tryOpen()};
  img.src=src;
  requestAnimationFrame(function(){bar.style.transform='scaleX(.6)'});
  setTimeout(function(){minTime=true;tryOpen()},1600);
  setTimeout(open,6000);
  document.getElementById('skip').addEventListener('click',open);
})();
</script>
</body>
</html>
